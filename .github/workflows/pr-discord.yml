name: PR を Discord に流す

# PR を作った・下書きを外したとき (2 行) とマージしたとき (1 行) に #akashic へ投稿する。
# 開発の流れをそのまま見えるようにするためのもので、CI の結果は載せない。
# 本文はリンク先で読めるので載せない (Discord には折りたたみが無く、載せると流れが追えなくなる)
on:
  pull_request:
    types: [opened, ready_for_review, closed]

jobs:
  notify:
    # 下書きの作成は流さない (下書きを外したときに流す)。閉じたのはマージだけ流す
    if: >-
      (github.event.action == 'opened' && !github.event.pull_request.draft) ||
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'closed' && github.event.pull_request.merged)
    runs-on: ubuntu-latest
    steps:
      - name: Discord 通知
        env:
          # fork からの PR には secrets が渡らないので空になる (= 何もしない)
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTION: ${{ github.event.action }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL が無いので送らない"
            exit 0
          fi
          # URL を <> で包むとリンクのプレビュー (= 埋め込み) が付かない
          jq -n \
            --arg action "$ACTION" --arg title "$TITLE" --arg number "$NUMBER" --arg url "$URL" \
            --arg author "$AUTHOR" --arg head "$HEAD" \
            --arg diff "+${ADDITIONS} / -${DELETIONS}" \
            '("[#" + $number + " " + ($title | gsub("\\]"; "\\]")) + "](<" + $url + ">)") as $link
            | {
                username: "akashic PR",
                content: (
                  if $action == "closed" then "🟣 マージ: " + $link
                  else "🟢 " + $link + "\n" + $author + " · `" + $head + "` · " + $diff
                  end
                )
              }' | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
