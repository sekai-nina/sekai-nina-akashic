name: CI

on:
  push:
    branches: [main]
  # PR でも回さないとゲートとして機能しない (マージ後に初めて落ちる)
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      # 動画の時間的な裏付けの評価（標準ライブラリのみ・DB 接続なし）
      - run: python3 scripts/evaluate-video-evidence-test.py
      - run: python3 scripts/collect-video-evidence-test.py
      - run: python3 scripts/prepare-video-benchmark-test.py
      - run: python3 scripts/report-video-benchmark-test.py
      - run: python3 scripts/evaluate-video-negative-bank-test.py
      # Drive直接取得の認証・Range再開・失効停止（標準ライブラリのみ）
      - run: python3 scripts/scene-drive-source-test.py
      # 本番 DB を守る PreToolUse フックの判定 (.claude/hooks/guard-prod-db.py)
      - run: python3 -m unittest discover -s .claude/hooks
