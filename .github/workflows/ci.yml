name: CI

on:
  push:
    branches: [main]
  # PR でも回さないとゲートとして機能しない (マージ後に初めて落ちる)
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      # 本番 DB を守る PreToolUse フックの判定 (.claude/hooks/guard-prod-db.py)
      - run: python3 -m unittest discover -s .claude/hooks
